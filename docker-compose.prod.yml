services:
  fittune-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fittune-api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Derived from the Postgres credentials so they are defined once; keep the password URL-safe.
      FITTUNE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fittune-postgres:5432/${POSTGRES_DB}
      FITTUNE_BIND_ADDR: 0.0.0.0:4733
      FITTUNE_LOG_FORMAT: json
    command: ["serve"]
    depends_on:
      fittune-postgres:
        condition: service_healthy
    expose:
      - "4733"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - fittune_edge_net
      - data_net
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  # Created once on the VPS and shared with the platform-edge Caddy
  fittune_edge_net:
    external: true
  data_net:
    internal: true
