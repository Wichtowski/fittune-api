services:
  fittune-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fittune-api:
    # Built and pushed by the deploy workflow; FITTUNE_APP_VERSION is the release tag
    image: ghcr.io/wichtowski/fittune-api:${FITTUNE_APP_VERSION:?Set FITTUNE_APP_VERSION to the release tag}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Derived from the Postgres credentials so they are defined once; keep the password URL-safe.
      FITTUNE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fittune-postgres:5432/${POSTGRES_DB}
      FITTUNE_BIND_ADDR: 0.0.0.0:4733
      FITTUNE_LOG_FORMAT: json
      FITTUNE_OCR_ENDPOINT: http://fittune-ocr:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FITTUNE_PHOTOS_ENDPOINT: http://fittune-rustfs:9000
      # Caddy sets it to the real client IP; the API is only reachable through the edge network
      FITTUNE_CLIENT_IP_HEADER: X-Real-IP
    command: ["serve"]
    depends_on:
      fittune-postgres:
        condition: service_healthy
      fittune-photos-bucket:
        condition: service_completed_successfully
    expose:
      - "4733"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - fittune_edge_net
      - data_net
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fittune-ocr:
    image: ghcr.io/wichtowski/fittune-ocr:${FITTUNE_APP_VERSION:?Set FITTUNE_APP_VERSION to the release tag}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - data_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fittune-rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${FITTUNE_PHOTOS_ACCESS_KEY:?Set FITTUNE_PHOTOS_ACCESS_KEY in ENV_PRODUCTION}
      RUSTFS_SECRET_KEY: ${FITTUNE_PHOTOS_SECRET_KEY:?Set FITTUNE_PHOTOS_SECRET_KEY in ENV_PRODUCTION}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    expose:
      - "9000"
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fittune-photos-bucket:
    image: rustfs/rc:latest
    depends_on:
      fittune-rustfs:
        condition: service_healthy
    environment:
      ACCESS_KEY: ${FITTUNE_PHOTOS_ACCESS_KEY:?Set FITTUNE_PHOTOS_ACCESS_KEY in ENV_PRODUCTION}
      SECRET_KEY: ${FITTUNE_PHOTOS_SECRET_KEY:?Set FITTUNE_PHOTOS_SECRET_KEY in ENV_PRODUCTION}
      BUCKET: ${FITTUNE_PHOTOS_BUCKET:?Set FITTUNE_PHOTOS_BUCKET in ENV_PRODUCTION}
    entrypoint: ["/bin/sh", "-c"]
    command: ["/usr/bin/rc alias set photos http://fittune-rustfs:9000 \"$$ACCESS_KEY\" \"$$SECRET_KEY\" && (/usr/bin/rc ls photos/\"$$BUCKET\" >/dev/null 2>&1 || /usr/bin/rc mb photos/\"$$BUCKET\")"]
    networks:
      - data_net

volumes:
  pgdata:
  rustfsdata:

networks:
  # Created once on the VPS and shared with the platform-edge Caddy
  fittune_edge_net:
    external: true
  data_net:
    internal: true
