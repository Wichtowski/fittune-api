name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fittune
          POSTGRES_PASSWORD: fittune
          POSTGRES_DB: fittune
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fittune -d fittune"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://fittune:fittune@localhost:5432/fittune

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy with dev fixtures
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # All features, so the dev fixtures are seeded into a fresh database on every change
      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
