name: Deploy Backend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Push the release image to GHCR; the VPS pulls it with the same short-lived token
  packages: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      RELEASE_VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/wichtowski/fittune-api
      OCR_IMAGE: ghcr.io/wichtowski/fittune-ocr
      # Unique per run, so concurrent or retried deploys never share uploaded files
      RELEASE_DIR: /tmp/fittune-release-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build production env file
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FITTUNE_PHOTOS_BUCKET: ${{ vars.FITTUNE_PHOTOS_BUCKET || 'fittune-progress-photos' }}
          FITTUNE_PHOTOS_ACCESS_KEY: ${{ secrets.FITTUNE_PHOTOS_ACCESS_KEY }}
          FITTUNE_PHOTOS_SECRET_KEY: ${{ secrets.FITTUNE_PHOTOS_SECRET_KEY }}
        run: |
          cat > .env.production <<'ENVEOF'
          ${{ secrets.ENV_PRODUCTION }}
          ENVEOF

          sed -i '/^FITTUNE_APP_VERSION=/d' .env.production
          printf '\nFITTUNE_APP_VERSION=%s\n' "${RELEASE_VERSION}" >> .env.production

          # The dedicated secret is the only API key source, including when unset
          sed -i '/^OPENAI_API_KEY=/d' .env.production
          printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY}" >> .env.production

          # Photo storage credentials live in their own secrets; they override ENV_PRODUCTION when set
          for name in FITTUNE_PHOTOS_BUCKET FITTUNE_PHOTOS_ACCESS_KEY FITTUNE_PHOTOS_SECRET_KEY; do
            if [ -n "${!name}" ]; then
              sed -i "/^${name}=/d" .env.production
              printf '%s=%s\n' "${name}" "${!name}" >> .env.production
            fi
          done

      # Fail before touching the VPS, while the running stack is still untouched
      - name: Validate production compose config
        run: |
          cp .env.production .env
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
          rm .env

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built once here, so the VPS only pulls and runs it and never needs the source
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CPU OCR image
        uses: docker/build-push-action@v7
        with:
          context: ./ocr-service
          push: true
          tags: ${{ env.OCR_IMAGE }}:${{ env.RELEASE_VERSION }}
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr

      - name: Copy release files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          # Only what the stack and the operator make targets need; the image holds the app
          source: "docker-compose.prod.yml,Makefile,.env.production"
          target: ${{ env.RELEASE_DIR }}

      - name: Deploy stack on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script_stop: true
          envs: DEPLOY_PATH,RELEASE_DIR,RELEASE_VERSION,IMAGE,OCR_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: "15m"
          script: |
            set -euo pipefail
            : "${DEPLOY_PATH:?}" "${RELEASE_DIR:?}"

            # The job token expires when the job ends; drop the stored login either way
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "${RELEASE_DIR}"' EXIT
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull before touching the running stack, so a failed pull leaves it as it was
            docker pull "${IMAGE}:${RELEASE_VERSION}"
            docker pull "${OCR_IMAGE}:${RELEASE_VERSION}"

            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # Keep only the release files; earlier releases shipped the whole repository
            find . -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            mv "${RELEASE_DIR}/docker-compose.prod.yml" "${RELEASE_DIR}/Makefile" .
            mv "${RELEASE_DIR}/.env.production" .env
            chmod 600 .env

            # Recreates only what changed; named volumes (Postgres, RustFS) are kept.
            # Migrations run on API start-up.
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            docker compose --env-file .env -f docker-compose.prod.yml ps

            # Drop untagged layers of superseded releases
            docker image prune -f
